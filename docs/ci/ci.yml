name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      android: ${{ steps.filter.outputs.android }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/curriculum/**'
              - 'scripts/**'
              - 'package.json'
              - 'tests/**'
            api:
              - 'services/api/**'
              - 'packages/contracts/**'
              - 'packages/curriculum/**'
              - 'training/**'
              - 'compose.yaml'
              - 'Dockerfile'
              - 'services/api/Dockerfile'
            android:
              - 'apps/android/**'
              - 'apps/web/**'
              - 'packages/curriculum/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - '**.md'
            workflows:
              - '.github/**'

  lint-workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs exist
        run: |
          test -f docs/MIGRATION_PLAN.md
          test -f docs/PROVENANCE.md
          test -f docs/SAFETY.md
          test -f docs/adr/0001-monorepo-layout.md
          test -f docs/adr/README.md
          echo "PASS: required docs present"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
      - name: Verify generated web and Android assets are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated assets are out of date. Run 'npm run sync' and commit the result."
            exit 1
          fi

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/api/requirements.txt pytest==8.3.5
      - run: python -m pytest -q
        working-directory: services/api
      - name: Verify training data is reproducible from the curriculum
        run: python training/prepare_data.py && git diff --exit-code training/train.jsonl training/eval.jsonl
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t indigloo-ai-mentor-api:ci .
      - name: Smoke-test the running container
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8000:8000 indigloo-ai-mentor-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:8000/app/
          test "$(curl -fsS http://127.0.0.1:8000/v1/lessons | python -c 'import json,sys; print(len(json.load(sys.stdin)["lessons"]))')" = 15
      - name: Container logs
        if: always()
        run: docker logs api-smoke || true

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Default package list includes removed `tools`; keep explicit list in sync with compileSdk.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ci-ok:
    if: always()
    needs: [changes, lint-workflows, docs, web, api, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate
        run: |
          # Skipped jobs (path filter) count as success; failed/cancelled fail the gate.
          for pair in \
            "lint-workflows:${{ needs.lint-workflows.result }}" \
            "docs:${{ needs.docs.result }}" \
            "web:${{ needs.web.result }}" \
            "api:${{ needs.api.result }}" \
            "android:${{ needs.android.result }}"; do
            name="${pair%%:*}"
            result="${pair##*:}"
            echo "$name=$result"
            case "$result" in
              success|skipped) ;;
              *) echo "::error::$name finished with $result"; exit 1 ;;
            esac
          done
          echo "PASS: ci-ok"
